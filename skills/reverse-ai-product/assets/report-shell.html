<head>

  <title>REPORT_TITLE</title>
  <style>
    :root{--ink:#142238;--muted:#667387;--line:#d8e0e9;--paper:#fff;--soft:#f5f7fa;--navy:#132d50;--blue:#286bd2;--green:#197354;--green-bg:#e9f7f1;--amber:#8b6200;--amber-bg:#fff4d7;--orange:#a95416;--orange-bg:#fff0e4;--gray:#626d7d;--gray-bg:#eef1f5;--red:#b13d49;--red-bg:#fff0f1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;color:var(--ink);background:#edf2f7;font:15px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.hero{padding:64px clamp(20px,7vw,96px);color:#fff;background:linear-gradient(135deg,#10213b,#1a477d 60%,#3473bd)}.hero h1{margin:0;font-size:clamp(34px,5vw,62px);line-height:1.1}.hero p{max-width:960px;color:#dce8f7}main{width:min(1500px,calc(100% - 30px));margin:auto;padding:28px 0 72px}section{margin:22px 0;padding:clamp(20px,4vw,40px);background:var(--paper);border:1px solid var(--line)}h2{margin:0 0 16px;font-size:clamp(25px,3vw,36px)}.table-wrap,.diagram-shell{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 11px;vertical-align:top;border-bottom:1px solid var(--line)}th{color:#fff;background:var(--navy);text-align:left}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:750}.confirmed{color:var(--green);background:var(--green-bg)}.inferred{color:var(--amber);background:var(--amber-bg)}.recommended{color:var(--orange);background:var(--orange-bg)}.unknown{color:var(--gray);background:var(--gray-bg)}.risk{color:var(--red);background:var(--red-bg)}.source{padding:16px;color:#dce8f7;background:#10213b;overflow:auto;white-space:pre;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}@media(max-width:650px){main{width:calc(100% - 16px)}section{padding:18px 13px}.hero{padding:48px 18px}}
  </style>
</head>
